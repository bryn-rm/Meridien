<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian Dashboard</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #0b1220; color: #e6edf6; }
      .wrap { max-width: 900px; margin: 48px auto; padding: 24px; }
      .card { background: #121a2b; border: 1px solid #24324d; border-radius: 12px; padding: 16px; }
      button { background: #4f7cff; border: 0; color: white; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
      pre { white-space: pre-wrap; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>MERIDIAN — AI Life Operating System</h1>
      <p>Generate a cross-domain daily briefing from calendar, finance, health, goals, and comms agents.</p>
      <div class="card">
        <button id="briefing">Generate briefing</button>
        <h3>Result</h3>
        <pre id="result">Press the button to fetch your briefing.</pre>
      </div>
    </div>
    <script>
      const result = document.getElementById('result');
      document.getElementById('briefing').addEventListener('click', async () => {
        result.textContent = 'Generating...';
        const response = await fetch('http://localhost:8000/briefing', { method: 'POST' });
        const data = await response.json();
        result.textContent = data.briefing_text;
      });
    </script>
  </body>
</html>
